
- hosts: control, compute
  become: true
  gather_facts: false

  tasks:
  - name: Install python-minimal
    raw: "type python3 &> /dev/null && exit 77 || { apt update &> /dev/null; apt install -y python3-minimal && exit 66; }"
    args:
      executable: /bin/bash
    register: install_python_minimal
    changed_when: install_python_minimal.rc == 66
    failed_when: install_python_minimal.rc != 77 and install_python_minimal.rc != 66
  - name: Install pip
    raw: "type pip3 &> /dev/null && exit 77 || { apt update && apt install -y python3-pip && exit 66; }"
    args:
      executable: /bin/bash
    register: install_python_pip
    changed_when: install_python_pip.rc == 66
    failed_when: install_python_pip.rc != 77 and install_python_pip.rc != 66

  - name: install all required apt packages
    package:
      name: "{{ item }}"
      state: present
    # All these packages are already installed on all VMs.
    # Skip this task on re-runs to avoid getting stuck in apt again.
    when: false
    loop:
      - python3-dev
      - python3-pip
      - libffi-dev
      - gcc
      - libssl-dev

  # Ubuntu 24.04 blocks "pip install" into the system Python (PEP 668),
  # so the Docker SDK for Python is installed from the distribution package.
  - name: install docker SDK for python
    apt:
      name: python3-docker
      state: present
      update_cache: true
